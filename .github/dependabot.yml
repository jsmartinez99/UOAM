version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "jsmartinez99"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "playwright-mcp"
        comment: "Tooling dependency not used in production; pinned to 0.0.10 for stability."

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "jsmartinez99"
    labels:
      - "dependencies"
      - "ci"
