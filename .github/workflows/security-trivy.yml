name: Security - Trivy Docker Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'  # Todos los días a medianoche
  workflow_run:
    workflows: ["CI/CD - Node.js + Docker + Kubernetes"]
    types:
      - completed  # Se ejecuta después de que CI/CD termine

jobs:
  trivy-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Para acceder a GHCR
    steps:
      - name: Checkout código
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Loguear en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer tag de la imagen
        id: image
        run: |
          # Usar el mismo tag que en CI/CD
          IMAGE_TAG=${{ github.sha }}
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            IMAGE_TAG="latest"
          fi
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'  # Fallar solo en vulnerabilidades críticas/altas

      - name: Subir resultados a GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
